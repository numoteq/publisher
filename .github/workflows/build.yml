name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=v2.25.1-numoteq
          tags: |
            ghcr.io/numoteq/publisher:sha-${{ github.sha }}
            ghcr.io/numoteq/publisher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
